services:
  postgres:
    image: postgres:18.4-alpine
    container_name: taskflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: migrator

    container_name: taskflow-migrate

    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner

    container_name: taskflow-api

    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

    ports:
      - "${API_PORT:-4000}:4000"

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

volumes:
  taskflow_postgres_data:
